services:
  bonsai:
    build: .
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./distributions/bonsai/config.yaml:/etc/bonsai/config.yaml:z
    depends_on:
      - lgtm

  lgtm:
    image: grafana/otel-lgtm:latest
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin

  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=ollygarden

  telemetrygen:
    image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:latest
    command: traces --otlp-endpoint bonsai:4317 --otlp-insecure --duration 1000h --rate 10
    depends_on:
      - bonsai

name: OTel for Programmers Go

on:
  push:
    branches: ["main"]
    paths:
      - "2025-07-30-otel-for-programmers/**"
      - ".github/workflows/otel-for-programmers-go.yaml"
  pull_request:
    branches: ["main"]
    paths:
      - "2025-07-30-otel-for-programmers/**"
      - ".github/workflows/otel-for-programmers-go.yaml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 2025-07-30-otel-for-programmers
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"

      - name: Verify module metadata
        run: go mod tidy -diff

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -shuffle=on -count=1 ./...
